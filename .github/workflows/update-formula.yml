name: Update Formula

on:
  repository_dispatch:
    types: [update-formula]

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update formula
        env:
          VERSION: ${{ github.event.client_payload.version }}
          SHA256: ${{ github.event.client_payload.sha256 }}
        run: |
          # Validate inputs
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format"
            exit 1
          fi
          if ! echo "$SHA256" | grep -qE '^[a-f0-9]{64}$'; then
            echo "Invalid SHA256 format"
            exit 1
          fi
          
          # Update formula
          sed -i "s|url \"https://files.pythonhosted.org/packages/source/s/some1/some1-.*\.tar\.gz\"|url \"https://files.pythonhosted.org/packages/source/s/some1/some1-${VERSION}.tar.gz\"|" Formula/some1.rb
          sed -i "s|sha256 \"[a-f0-9]*\"|sha256 \"${SHA256}\"|" Formula/some1.rb
          
          cat Formula/some1.rb

      - name: Commit and push
        env:
          VERSION: ${{ github.event.client_payload.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/some1.rb
          git commit -m "Update some1 to ${VERSION}"
          git push
